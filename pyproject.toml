[project]
name = "eco-measure-amsterdam"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "codecarbon>=3.3.2",
    "ecologits[openai]>=0.11.3",
    "jupyter>=1.1.1",
    "nltk>=3.10.4",
    "openai>=2.54.0",
    "plotnine>=0.15.9",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "transformers>=5.22.2",
]

[dependency-groups]
docs = [
    "quarto-cli>=1.11.9",
]

[project.optional-dependencies]
# PyTorch comes in two builds; install exactly one:
#   uv sync --extra cpu     CPU only (and Apple Silicon GPUs on macOS)
#   uv sync --extra cu132   NVIDIA GPU, CUDA 13.2 (Linux and Windows)
cpu = ["torch>=2.15.0"]
cu132 = ["torch>=2.15.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu132" }]]

[tool.uv.sources]
# On Linux and Windows each extra takes torch from its own PyTorch index.
# macOS uses PyPI for both: its build is CPU-only and also supports the GPU
# of Apple Silicon Macs.
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu132", extra = "cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
