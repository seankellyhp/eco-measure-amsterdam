[project]
name = "carbon-skill"
version = "0.3.0"
description = "Energy, emissions and token accounting for AI-assisted coding, with CodeCarbon and EcoLogits"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "codecarbon==3.3.2",
    "ecologits==0.11.3",
    "psutil>=5.9",
    "platformdirs>=4",
]

[project.scripts]
carbon = "carbon_skill.cli:main"
carbon_start = "carbon_skill.cli:main_start"
carbon_end = "carbon_skill.cli:main_end"
carbon_report = "carbon_skill.cli:main_report"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carbon_skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: starts a real codecarbon monitor"]
